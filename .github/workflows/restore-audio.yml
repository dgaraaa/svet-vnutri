name: Restore original audio
on:
  push:
    paths:
      - '.github/workflows/restore-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified original audio files
        shell: python
        run: |
          import hashlib, pathlib, urllib.request
          base = "https://svet-vnutri-darya-preview.handycrown512.chatgpt.site/assets/"
          files = {
              "dynasty.mp3": (2524313, "a29830997c12559410bd11d27aa2157edefd8887716fb38cc15fbd1a31481552"),
              "raz-i-navsegda.mp3": (5533866, "a03118fb08974979ee3e0eac83984bb89adc75f2f1382e30e72d6719ffb68e23"),
              "surprise-song.mp3": (3897556, "cc80b16fbf5ee244daf35eb26fed69280ac2b5ca9ab34dcc5416b6123ff03e32"),
              "sure-thing.mp3": (7817925, "675db447dd7ac57b116a53e47c8d60b57fc6cde4d0cc6822f344aae39cfa50b4"),
              "roommates.mp3": (8600730, "dc2f680767f1835b14d106db7ba8e8039d4db1dd9cbf4e4c41de7ec88f54ae5f"),
          }
          for name, (size, digest) in files.items():
              req = urllib.request.Request(base + name, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = response.read()
              assert len(data) == size, f"Unexpected size for {name}"
              assert hashlib.sha256(data).hexdigest() == digest, f"Checksum mismatch for {name}"
              pathlib.Path("assets", name).write_bytes(data)
              print(f"Verified {name}: {len(data)} bytes")
      - name: Save restored audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Restore five complete original audio files"
            git push
          fi